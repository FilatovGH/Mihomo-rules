name: build-mrs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # <-- ОБЯЗАТЕЛЬНО для Releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mihomo
        run: |
          sudo apt update
          curl -L \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.9/mihomo-linux-amd64-v1.19.9.deb \
            -o mihomo.deb
          sudo apt install -y ./mihomo.deb

      - name: Aggregate IPCIDR
        run: |
          mkdir -p build
          cat ASN/Alfa-Bank/*.ipcidr | sort -u > build/Alfa-Bank.ipcidr
          cat ASN/Kontur/*.ipcidr    | sort -u > build/Kontur.ipcidr

      - name: Compile MRS
        run: |
          mihomo convert-ruleset ipcidr text \
            build/Alfa-Bank.ipcidr Alfa-Bank.mrs

          mihomo convert-ruleset ipcidr text \
            build/Kontur.ipcidr Kontur.mrs

      - name: Publish MRS to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest rule-sets"
          files: |
            Alfa-Bank.mrs
            Kontur.mrs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mrs
          path: |
            Alfa-Bank.mrs
            Kontur.mrs
