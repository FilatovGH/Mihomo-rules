name: build-mrs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mihomo
        run: |
          curl -L \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.9/mihomo-linux-amd64-v1.19.9.deb \
            -o mihomo.deb
          sudo apt install -y ./mihomo.deb

      - name: Aggregate IPCIDR
        run: |
          mkdir -p build
          cat ASN/Alfa-Bank/*.ipcidr | sort -u > build/Alfa-Bank.ipcidr
          cat ASN/Kontur/*.ipcidr    | sort -u > build/Kontur.ipcidr

      - name: Compile MRS
        run: |
          mihomo convert-ruleset ipcidr text \
            build/Alfa-Bank.ipcidr Alfa-Bank.mrs

          mihomo convert-ruleset ipcidr text \
            build/Kontur.ipcidr Kontur.mrs

      - uses: actions/upload-artifact@v4
        with:
          name: mrs
          path: |
            Alfa-Bank.mrs
            Kontur.mrs
